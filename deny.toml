# Dependency policy for the fn64 workspace. Mechanizes the clean-room
# license rule that AGENTS.md's "Clean-room protocol" section currently
# enforces by review alone -- see docs/DISCOVER-PLAN.md "Research intake"
# for the same allow-list stated in prose.
#
# multiple-versions = "warn" until task 1.3 (dependency de-duplication)
# lands; flip to "deny" once that's done so a future PR can't silently
# reintroduce a duplicate.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    # epaint's bundled default fonts (font-only license, not code; permissive).
    "OFL-1.1",
    # epaint's bundled default fonts, Ubuntu Font License (font-only,
    # permissive). egui 0.36 moved the fonts into the separate
    # `epaint_default_fonts` crate and declares the SPDX `Ubuntu-font-1.0`;
    # the older non-SPDX `LicenseRef-UFL-1.0` spelling egui 0.27 used is gone
    # from the graph with that upgrade, so allowing it now only produces an
    # `unmatched license allowance` warning.
    "Ubuntu-font-1.0",
    # xxhash-rust (Boost Software License 1.0; permissive).
    "BSL-1.0",
]
# GPL-*/AGPL-*/LGPL-* are not in `allow` above, which is deny-by-default
# for anything unlisted -- no separate `deny` list needed to exclude them.

[bans]
multiple-versions = "warn"

[advisories]
# cargo-deny 0.20.2's schema (installed version) changed `unmaintained` from
# a "warn"/"deny" severity string (what the task brief specified, likely
# against an older cargo-deny) to a scope selector: which unmaintained
# advisories to check at all. "workspace" is the closest equivalent to
# "warn" intent -- it surfaces unmaintained direct/workspace dependencies
# without failing the build on merely-unmaintained transitive crates deep
# in the graph, which this version's schema has no separate severity knob
# for. Revisit if a later cargo-deny reintroduces true warn/deny levels.
unmaintained = "workspace"
yanked = "deny"
# quick-xml 0.39.4 is pinned by wayland-scanner 0.31.10 (via
# fn64-shell's winit -> wayland stack); no fixed version is reachable
# through that pin. Both advisories are Linux-only Wayland protocol
# scanning of vendored trusted XML at build time -- not applicable to
# untrusted input the way the advisories describe, since fn64 doesn't
# parse untrusted XML through this dependency.
# cargo-deny 0.20.2's ignore-entry schema accepts only {id, reason} -- no
# `date` field -- so the review date is recorded in the reason text instead.
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "2026-09-06: Linux-only Wayland protocol scanning of vendored trusted XML at build time; no fixed version reachable through wayland-scanner 0.31.10" },
    { id = "RUSTSEC-2026-0195", reason = "2026-09-06: Linux-only Wayland protocol scanning of vendored trusted XML at build time; no fixed version reachable through wayland-scanner 0.31.10" },
]
