# Minimal enforcement gate. Until this existed, the project's 29 gate_* binaries,
# certification examples, and doc-lint checks were all run by hand -- so drift
# (e.g. stale generated docs) landed unnoticed. This wires the two authoritative
# checks the repo already defines:
#   - `cargo nextest run --workspace` -- the "is it green?" gate (.config/nextest.toml
#     explains why nextest, not `cargo test`: it fixes the fn64-abi exit-code race).
#   - `scripts/lint-docs.py` -- catches doc-drift (dangling refs, phantom crates,
#     stale generated docs). It internally runs the NMR-surface and base-renderer
#     matrix checks, so they don't need separate steps.
#
# ponytail: two jobs, stock actions, no matrix. Add OS/toolchain fan-out or the
# GPU-bound rt64 certification examples only when they actually gate a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo nextest (workspace)
    runs-on: ubuntu-latest
    # Job-wide, NOT on the cargo step: rust-cache keys and restores before that
    # step runs, so profile vars scoped to the step change the rustc invocation
    # afterwards and mismatch every restored fingerprint -- a full cache hit
    # still recompiled 129 dependencies. Same profile for cache and build.
    env:
      # Test binaries are run once and thrown away -- debuginfo is dead weight
      # in link time and cache size, and CI never opens a debugger.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The dominant cost here is linking ~86 test binaries, not running them.
      # mold swaps in as the system linker (no RUSTFLAGS change, so restored
      # cache fingerprints stay valid) and cuts the link phase substantially.
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Without this, a failing run saves nothing -- and the runs that fail
          # are exactly the ones you re-push to, so the cache stayed empty and
          # every run rebuilt ~700 crates from scratch (~13 min).
          cache-on-failure: true
          # Existing entries were saved under the old step-scoped profile and
          # cannot match the job-wide one; bump to avoid restoring them.
          prefix-key: v1-rust
      - uses: taiki-e/install-action@nextest
      # fn64-audio/fn64-shell link ALSA via cpal/gilrs; the runner image has no
      # libasound headers. Ghidra runner tests execute memory-guard.zsh, while
      # the stock image does not provide zsh.
      # Renderer tests create a real headless wgpu device. Hosted Linux has no
      # hardware adapter, so Lavapipe is the explicit test adapter rather than
      # allowing create() to fail and cascading through every raster fixture.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers zsh
      # The ROM-gated aki-audio-ucode lives in examples/*/audio-ucode, which are
      # their own workspaces -- `--workspace` never reaches them, so no exclude
      # is needed (naming it only emitted "excluded package(s) not found").
      #
      # Tests themselves take ~8s; the cost is compiling 86 test binaries, so
      # the levers are the cache above and the job-wide profile vars.
      - run: cargo nextest run --workspace

  lint:
    name: clippy (workspace, -D warnings)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # Full clippy::all landed >500 findings (including 20 hard `deny`
      # errors from clippy::approx_constant on ported math constants that
      # intentionally pin an upstream literal, e.g. M_PI = 3.14159265) --
      # per the task-1.2 brief's own >~50-findings fallback, this job is
      # rustc warnings only (-A clippy::all) until those are triaged and
      # clippy groups are enabled one PR at a time.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::all

  docs:
    name: doc-drift lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The refusal inventory verifies cited assessment commits as commit
          # objects; a depth-1 checkout cannot satisfy that evidence contract.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # lint-docs.py shells out to `rg`, which isn't on the runner image.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 scripts/lint-docs.py
      # lint-docs.py already runs this in check mode via check_knob_registry;
      # a separate step gives it its own CI log section and a failure that
      # names the registry specifically rather than "lint-docs failed".
      - run: python3 scripts/knob-registry.py
      # The lint itself is checked first: it enforces a whole-crate rule
      # ("only diag_env may read the environment"), so a checker that silently
      # stopped matching would report clean over 300 unexamined files.
      - run: python3 scripts/lint-hot-path-env.py --self-test
      - run: python3 scripts/lint-hot-path-env.py
      # crates/fn64-shell/rs is a standalone workspace, so NOTHING else in CI
      # builds it: a dependency added to crates/fn64-shell/Cargo.toml alone is
      # invisible until someone runs scripts/play-wm2000.sh. That is exactly
      # how the thiserror conversion left the WM2000 play lane unbuildable.
      # Self-test first, same reason as lint-hot-path-env above.
      - run: python3 scripts/lint-rs-lane-manifest.py --self-test
      - run: python3 scripts/lint-rs-lane-manifest.py
      - run: python3 scripts/test-pgo-release.py
      # Owns the frame digests the docs cite, so lint-docs.py's "a hash needs a
      # test" rule has a test to point at.
      - run: python3 scripts/check-reference-frame-digests.py
      # Mechanizes deny.toml's license/advisory policy (task 1.5).
      # `cargo deny check` is green: crossbeam-epoch bumped to 0.9.21
      # (clears RUSTSEC-2026-0204), RUSTSEC-2026-0194/-0195 (quick-xml,
      # pinned by wayland-scanner 0.31.10, no fixed version reachable)
      # explicitly ignored in deny.toml with a reason, and epaint's
      # bundled-font OFL-1.1/Ubuntu-font-1.0 plus xxhash-rust's BSL-1.0
      # added to the license allow list (all three permissive) -- see the
      # batch-A report's fix-round entry for the full review record.
      - uses: EmbarkStudios/cargo-deny-action@v2
