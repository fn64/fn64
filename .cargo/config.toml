# Incremental compilation is off by default for this workspace.
#
# Cargo writes a fresh incremental cache generation per rebuild and never
# collects the old ones. Measured here: `target/debug/incremental` reached
# 65 GB, with individual `fn64_discover` caches at ~1.3 GB each and dozens
# retained -- one per meaningful rebuild.
#
# The tradeoff is deliberate rather than universal. This workspace's dominant
# build mode is one-shot: 46 `gate_*` binaries in `fn64-discover` alone, each
# typically built once and run once against a ROM, plus CI running
# `cargo nextest run --workspace` from a cold or near-cold state. Incremental
# caching buys those runs nothing while costing tens of gigabytes.
#
# For an interactive edit-compile-test loop on one crate, incremental is
# genuinely faster -- re-enable it per shell with `CARGO_INCREMENTAL=1`, which
# overrides this setting.
[build]
incremental = false
