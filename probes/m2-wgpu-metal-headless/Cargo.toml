[package]
name = "fn64-m2-wgpu-metal-headless"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "Headless wgpu Metal capability probe for fn64 renderer-port M2"

[workspace]

[[bin]]
name = "metal_caps"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
wgpu = { version = "=30.0.0", default-features = false, features = ["metal", "wgsl"] }
