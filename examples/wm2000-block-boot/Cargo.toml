# Standalone workspace (like ../wm2000-boot): requires an out-of-tree,
# game-derived build input (ROM env var) the main fn64 workspace must never
# depend on. Zero game content ships in this crate; the discovered pack and
# emitted runner live only under target/.
[package]
name = "wm2000-block-boot"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "wm2000-block-boot"
path = "src/main.rs"

# The interactive lane. A SECOND BINARY of this package rather than its own
# crate, deliberately: both binaries then share this package's one `build.rs`
# ROM discovery, its one `OUT_DIR` pack, and the already-compiled generated
# shard crates -- and both construct their program through the same
# `src/block_program.rs`, so the windowed lane cannot drift from the certified
# headless one.
[[bin]]
name = "wm2000-shell"
path = "src/shell.rs"

[features]
dynamic-withheld = [
    "fn64-abi/dynamic-mapped-runtime",
    "fn64-recomp-rs/dynamic-mapped-runtime",
]

[dependencies]
fn64-abi = { path = "../../crates/fn64-abi", features = ["recomp-rs"] }
fn64-recomp-rs = { path = "../../crates/fn64-recomp-rs", default-features = false, features = ["production-aot"] }
fn64-recomp-rs-codegen = { path = "../../crates/fn64-recomp-rs-codegen" }
fn64-boot-harness = { path = "../../crates/fn64-boot-harness", features = ["recomp-rs"] }
fn64-audio = { path = "../../crates/fn64-audio" }
fn64-render = { path = "../../crates/fn64-render" }
fn64-render-reference = { path = "../../crates/fn64-render-reference" }
fn64-runtime = { path = "../../crates/fn64-runtime" }
sha2 = "0.10"
serde_json = "1"
# Window/input stack for the `wm2000-shell` binary. Same versions as
# crates/fn64-shell/rs/Cargo.toml, because that shell's `framebuffer`,
# `input_map`, `gamepad`, and `timing` modules are included from there by
# `#[path]` and must compile against the same APIs.
winit = { version = "0.30", features = ["serde"] }
pixels = "0.15"
gilrs = { version = "0.11", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
wm2000-block-shard-00 = { path = "../wm2000-block-shards/shard00" }
wm2000-block-shard-01 = { path = "../wm2000-block-shards/shard01" }
wm2000-block-shard-02 = { path = "../wm2000-block-shards/shard02" }
wm2000-block-shard-03 = { path = "../wm2000-block-shards/shard03" }
wm2000-block-shard-04 = { path = "../wm2000-block-shards/shard04" }
wm2000-block-shard-05 = { path = "../wm2000-block-shards/shard05" }
wm2000-block-shard-06 = { path = "../wm2000-block-shards/shard06" }
wm2000-block-shard-07 = { path = "../wm2000-block-shards/shard07" }
wm2000-block-shard-08 = { path = "../wm2000-block-shards/shard08" }
wm2000-block-shard-09 = { path = "../wm2000-block-shards/shard09" }
wm2000-block-shard-10 = { path = "../wm2000-block-shards/shard10" }
wm2000-block-shard-11 = { path = "../wm2000-block-shards/shard11" }
wm2000-block-shard-12 = { path = "../wm2000-block-shards/shard12" }
wm2000-block-shard-13 = { path = "../wm2000-block-shards/shard13" }
wm2000-block-shard-14 = { path = "../wm2000-block-shards/shard14" }
wm2000-block-resident-tail-shard-00 = { path = "../wm2000-block-shards/shard15" }
wm2000-block-resident-tail-shard-01 = { path = "../wm2000-block-shards/shard16" }
wm2000-block-overlay-0-shard-00 = { path = "../wm2000-block-shards/overlay0-shard00" }
wm2000-block-overlay-0-shard-01 = { path = "../wm2000-block-shards/overlay0-shard01" }
wm2000-block-overlay-1-shard-00 = { path = "../wm2000-block-shards/overlay1-shard00" }
wm2000-block-overlay-2-shard-00 = { path = "../wm2000-block-shards/overlay2-shard00" }
wm2000-block-overlay-2-shard-01 = { path = "../wm2000-block-shards/overlay2-shard01" }
wm2000-block-overlay-2-shard-02 = { path = "../wm2000-block-shards/overlay2-shard02" }
wm2000-block-overlay-2-shard-03 = { path = "../wm2000-block-shards/overlay2-shard03" }
wm2000-block-overlay-2-shard-04 = { path = "../wm2000-block-shards/overlay2-shard04" }
wm2000-block-overlay-3-shard-00 = { path = "../wm2000-block-shards/overlay3-shard00" }
wm2000-block-overlay-3-shard-01 = { path = "../wm2000-block-shards/overlay3-shard01" }
wm2000-block-overlay-3-shard-02 = { path = "../wm2000-block-shards/overlay3-shard02" }
wm2000-block-overlay-3-shard-03 = { path = "../wm2000-block-shards/overlay3-shard03" }
wm2000-block-overlay-3-shard-04 = { path = "../wm2000-block-shards/overlay3-shard04" }
wm2000-block-overlay-3-shard-05 = { path = "../wm2000-block-shards/overlay3-shard05" }
wm2000-block-overlay-3-shard-06 = { path = "../wm2000-block-shards/overlay3-shard06" }

[build-dependencies]
fn64-discover = { path = "../../crates/fn64-discover" }
fn64-recomp-rs = { path = "../../crates/fn64-recomp-rs", default-features = false, features = ["aot-runtime"] }
fn64-recomp-rs-codegen = { path = "../../crates/fn64-recomp-rs-codegen" }
sha2 = "0.10"

[profile.release]
# No debug info. This binary links the whole generated dense-AOT shard catalog into
# ~121 MB, and DWARF for generated match arms is both enormous and useless --
# every earlier release build here either ran 40+ minutes or was OOM-killed,
# and this was a large part of why.
debug = false

# The generated shards dominate compile time and are cold code: they are
# dispatched through, not optimized around. Giving them many codegen units
# lets rustc parallelize instead of serializing on a few huge ones, without
# touching the -O level the hot handwritten crates get below.
codegen-units = 256

# Line tables for the three handwritten hot crates ONLY.
#
# `run_one_step` inlines its whole callee tree, so a sampling profiler
# attributes ~92% of self time to one frame and cannot say which part costs.
# Line tables let the sampler recover the inlined frames with file:line. The
# generated shards stay at `debug = false` above -- DWARF for their match arms
# is what made earlier release builds run 40+ minutes or get OOM-killed, and
# they are dispatched through rather than optimized around, so they are not
# what a profile needs to see into.
# The ROOT package too. The `debug = false` at `:94-99` above is about the
# GENERATED SHARD CRATES -- their DWARF is what made earlier release builds run
# 40+ minutes or get OOM-killed -- and it stays false for them. But the root
# package inheriting it is why `sample` attributes 99.99% of every profile to
# `wm2000_block_boot::main`: the dispatch loop lives here, it inlines its whole
# callee tree, and with no line tables the sampler cannot recover a single
# inlined frame. This crate is ~4k lines of handwritten code, so its DWARF is
# nothing like a shard's.
[profile.release.package.wm2000-block-boot]
debug = 1

[profile.release.package.fn64-recomp-rs]
codegen-units = 1
debug = 1
[profile.release.package.fn64-runtime]
codegen-units = 1
debug = 1
[profile.release.package.fn64-abi]
codegen-units = 1
debug = 1

[profile.dev.build-override]
# The shard build scripts perform exhaustive mechanical ROM discovery. Scope
# optimization to host build machinery so debug guest shards retain their
# lower-memory compilation profile.
opt-level = 1

[profile.dev]
# Dense AOT already expands to hundreds of MiB of native text. Debug info and
# incremental state multiply link and disk cost without improving guest
# evidence; keep assertions while bounding the production harness build.
debug = 0
incremental = false

# The root link cannot safely load that many opt-level-0 generated artifacts. Apply
# bounded optimization to dependency crates (including every generated shard)
# and partition each large shard across many LLVM units. The standalone root
# package itself remains in the ordinary dev profile.
[profile.dev.package."*"]
opt-level = 1
codegen-units = 16

# The CPU interpreter and block dispatcher. This was the one hot crate the
# per-package overrides below had missed -- fn64-runtime, fn64-abi and
# fn64-render-reference were already named, fn64-recomp-rs was not, and it
# executes every guest instruction.
#
# A route run to WM2000's menus takes ~48 minutes of EMULATION, a cost that
# was misread as inherent to the route. Optimizing the whole build is the
# obvious fix and the wrong one: the dense-AOT shards are hundreds of MiB of
# generated match arms whose LLVM cost is superlinear, which is why release
# builds of this example take 40+ minutes and have been OOM-killed twice.
# Naming the executing crates buys the run-time win without that compile-time
# cost, which is exactly what the existing entries below were already doing.
[profile.dev.package.fn64-recomp-rs]
opt-level = 3

# Raw-DPC LLE spends most of its host time in the deterministic reference
# renderer. Optimize that bounded handwritten crate without enabling release
# codegen across the generated shard catalog.
[profile.dev.package.fn64-render-reference]
opt-level = 2

# Framebuffer commits cross the typed RDRAM view for every pixel. Optimize the
# small handwritten memory-contract crate without changing generated shard
# codegen or enabling a broad dependency override.
[profile.dev.package.fn64-runtime]
opt-level = 3

# Unadmitted F3DZEX2 tasks deliberately fall back to the clean-room RSP
# interpreter in fn64-abi. Keep that handwritten hot path optimized without
# applying release codegen to the generated static-AOT shard catalog.
[profile.dev.package.fn64-abi]
opt-level = 3
