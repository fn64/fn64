[workspace]
# Standalone workspace, deliberately NOT a member of the main fn64
# workspace's Cargo.toml -- this crate's build.rs requires RECOMPILED_DIR/
# RECOMP_H_DIR/ROM env vars pointing at out-of-tree, game-derived material
# (see build.rs's module doc), so it must never be pulled into `cargo build
# --workspace`/`cargo test --workspace` at the fn64 repo root, which has to
# stay buildable/testable with zero game content and zero env-var
# preconditions.

[package]
name = "sm64-boot"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Headless boot harness for Super Mario 64 (SM64U, NTSC US) on fn64 -- the first render/execution of SM64 on the pure-Rust stack. Contains zero game content -- see build.rs's module doc for the RECOMPILED_DIR/RECOMP_H_DIR/ROM env-var contract."

[features]
default = []
rt64 = ["fn64-render-rt64/rt64"]

[[bin]]
name = "sm64-boot"
path = "src/main.rs"

# KNOWN LIMITATION (release only): the release optimizer folds two DISTINCT
# fn64-abi host shims -- osSpTaskYielded_recomp and osEepromProbe_recomp, which
# SM64's corpus lists in separate zero-size sections 66/80 -- to a single
# callable identity as seen through the C bridge's `&sym` FuncEntry
# initializers, tripping fn64's dispatch-registry assertion "one native
# callable pointer is assigned to multiple generated destinations" at
# section-registration time. The DEBUG build does not fold them and boots to
# the audio_init depth documented in src/main.rs. Neither lto=false nor
# -Wl,-no_deduplicate suppresses the fold; a proper fix belongs in fn64-abi's
# registry (it should tolerate one host shim backing multiple guest overlay
# slots). Use the debug binary for boot bring-up until then.

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dependencies]
fn64-runtime = { path = "../../crates/fn64-runtime" }
fn64-abi = { path = "../../crates/fn64-abi" }
fn64-boot-harness = { path = "../../crates/fn64-boot-harness" }
# The graphics seam + its headless reference software rasterizer. Registered
# via fn64_abi::set_render_backend_with_policy so submitted M_GFXTASKs
# actually rasterize (into an off-screen framebuffer we dump as PNG), instead
# of only hashing the blank VI framebuffer.
fn64-render = { path = "../../crates/fn64-render" }
fn64-render-reference = { path = "../../crates/fn64-render-reference" }
fn64-render-rt64 = { path = "../../crates/fn64-render-rt64" }
