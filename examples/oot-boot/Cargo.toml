[workspace]
exclude = ["audio-ucode", "rs"]
# Standalone workspace, deliberately NOT a member of the main fn64
# workspace's Cargo.toml -- this crate's build.rs requires RECOMPILED_DIR/
# RECOMP_H_DIR/ROM env vars pointing at out-of-tree, game-derived material
# (see build.rs's module doc), so it must never be pulled into `cargo build
# --workspace`/`cargo test --workspace` at the fn64 repo root, which has to
# stay buildable/testable with zero game content and zero env-var
# preconditions.

[package]
name = "oot-boot"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Headless boot harness for The Legend of Zelda: Ocarina of Time (OOTU, NTSC 1.0) on fn64 -- decomp-driven-first recompilation lane. Contains zero game content -- see build.rs's module doc for the RECOMPILED_DIR/RECOMP_H_DIR/ROM env-var contract."

[features]
rt64 = ["fn64-render-rt64/rt64"]

[[bin]]
name = "oot-boot"
path = "src/main.rs"

[build-dependencies]
cc = "1"
sha2 = "0.10"
toml = "0.8"

[dependencies]
fn64-runtime = { path = "../../crates/fn64-runtime" }
fn64-abi = { path = "../../crates/fn64-abi", features = ["recomp-rs"] }
fn64-boot-harness = { path = "../../crates/fn64-boot-harness", features = ["recomp-rs"] }
fn64-recomp-rs = { path = "../../crates/fn64-recomp-rs" }
# The graphics seam + its headless reference software rasterizer. Registered
# via fn64_abi::set_render_backend so submitted M_GFXTASKs actually
# rasterize (into an off-screen framebuffer we dump as PNG), instead of only
# hashing the blank VI framebuffer. See main.rs's render-backend section.
fn64-render = { path = "../../crates/fn64-render" }
fn64-render-reference = { path = "../../crates/fn64-render-reference" }
fn64-render-rt64 = { path = "../../crates/fn64-render-rt64" }
fn64-audio = { path = "../../crates/fn64-audio" }
