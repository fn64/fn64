[package]
name = "aki-audio-ucode"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"
description = "Out-of-tree adapter that recompiles the AKI-family audio microcode from the user's own ROM at build time; no game-derived bytes are stored here"

[dependencies]
fn64-audio = { path = "../../../crates/fn64-audio" }

[build-dependencies]
fn64-audio = { path = "../../../crates/fn64-audio" }
