# Runtime knob classification -- hand-maintained, checked by scripts/knob-registry.py.
#
# One entry per `FN64_*` name read in non-test code under crates/*/src. Every
# name the scanner finds MUST have an entry here (unknown names fail the
# script); every entry MUST still correspond to a name the scanner finds
# (stale entries fail too). Regenerate docs/RUNTIME-KNOBS.md after editing
# this file: `python3 scripts/knob-registry.py --write`.
#
# class:
#   user       -- a normal player/porter would set it to run or configure fn64.
#   diagnostic -- enables a census/probe/dump/trace/timing instrument, or is a
#                 kill-switch/A-B control for an internal mechanism. When
#                 unsure between diagnostic and user, this file chooses
#                 diagnostic and says so in the note (task 2.1 rule).
#   test-only  -- read only by gate binaries, examples, or render-conformance
#                 test runners; never something a player sets.
#   dead       -- read, but the value cannot change any behavior a live knob
#                 would.
#   build-time -- resolved at compile time via env!()/option_env!() (or
#                 injected by a build.rs's cargo:rustc-env=); baked into the
#                 binary once compiled and never re-read at runtime. NOT a
#                 runtime knob: task 2.2's typed Knobs struct cannot hold it,
#                 because there is nothing left to hold by the time any
#                 Knobs constructor could run. The script's own read-kind
#                 check enforces this: a build-time entry with any
#                 env::var/var_os read site fails, and so does a non-
#                 build-time entry whose every read site is env!()/
#                 option_env!().
#   retired    -- read only by a RETIRED_ENV_VARS-style trap that panics
#                 naming a replacement; exists to fail loudly rather than
#                 silently no-op (AGENTS.md "loud traps, no silent shrugs").
#                 The read site must not be deleted even though the name's
#                 own positive behavior is gone -- deleting it would let a
#                 leftover setting of the old name silently do nothing.

