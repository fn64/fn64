[package]
name = "fn64-discover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mechanical, zero-LLM N64 ROM function-metadata discovery frontend, per docs/DISCOVER-DESIGN.md. Proven facts + rejected candidates + an explicit unresolved frontier -- never a guessed symbol file."

[dependencies]
fn64-recomp-rs = { path = "../fn64-recomp-rs" }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
toml = "0.8"

[dev-dependencies]

[[bin]]
name = "gate_b1"
path = "src/bin/gate_b1.rs"

[[bin]]
name = "gate_b2"
path = "src/bin/gate_b2.rs"

[[bin]]
name = "gate_d1"
path = "src/bin/gate_d1.rs"

[[bin]]
name = "gate_d1_overlays"
path = "src/bin/gate_d1_overlays.rs"

[[bin]]
name = "gate_owners_overlays"
path = "src/bin/gate_owners_overlays.rs"

[[bin]]
name = "fn64-discover"
path = "src/bin/fn64_discover.rs"

[[bin]]
name = "gate_regions"
path = "src/bin/gate_regions.rs"

[[bin]]
name = "gate_homology"
path = "src/bin/gate_homology.rs"

[[bin]]
name = "gate_loaders"
path = "src/bin/gate_loaders.rs"

[[bin]]
name = "gate_static_closure"
path = "src/bin/gate_static_closure.rs"

[[bin]]
name = "gate_oot_reference"
path = "src/bin/gate_oot_reference.rs"

[[bin]]
name = "gate_coverage"
path = "src/bin/gate_coverage.rs"

[[bin]]
name = "gate_overlay_generalize"
path = "src/bin/gate_overlay_generalize.rs"
