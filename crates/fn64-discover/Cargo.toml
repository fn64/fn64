[package]
name = "fn64-discover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mechanical, zero-LLM N64 ROM function-metadata discovery frontend, per docs/DISCOVER-DESIGN.md. Proven facts + rejected candidates + an explicit unresolved frontier -- never a guessed symbol file."
autobins = false

[features]
default = []
writer-runtime-authority = ["dep:fn64-boot-harness"]
transform-invocation-certificate = ["fn64-cpu-runtime/dynamic-mapped-runtime"]

[dependencies]
fn64-boot-harness = { path = "../fn64-boot-harness", optional = true, default-features = false, features = ["recomp-rs"] }
fn64-cpu-runtime = { path = "../fn64-cpu-runtime", default-features = false, features = ["aot-runtime"] }
fn64-cpu-runtime-codegen = { path = "../fn64-cpu-runtime-codegen" }
fn64-runtime = { path = "../fn64-runtime" }
fn64-timing-trace = { path = "../fn64-timing-trace" }
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
libc = "0.2"
thiserror.workspace = true
toml = "0.8"

[dev-dependencies]

[[bin]]
name = "fn64-discover"
path = "src/main.rs"
test = true
