# Ocarina of Time (NTSC 1.0) load-image table geometry — the exact values of
# oot_reference::oot_load_image_tables(), expressed as data. Kept as the
# differential fixture proving the TOML tables path is equivalent to the
# compiled-in geometry: gate_decomp_reference with this file must reproduce
# gate_oot_reference's bound/proven counts on the same ROM.

[[load_image_tables]]
name = "dmadata"

[load_image_tables.shape]
location = { space = "Physical", offset = 0x7430 }
record_count = 0x5f6
record_stride = 0x10
source = { space = "Virtual", field_start = 0, field_end = 4 }
destination = { space = "physical_rom", field_start = 8, end = { field_or_source_length = 0xc } }

