# Super Mario 64 (US) static request-DMA claims. n64decomp/sm64
# src/game/memory.c `load_engine_code_segment` (answer key 0x80278974)
# loads the engine segment via the file-local `dma_read(dest, srcStart,
# srcEnd)` — o32: dest $a0(4), srcStart $a1(5), srcEnd $a2(6); the third
# argument is an EXCLUSIVE END address, hence size_is_end_address.
# dma_read is `static` and absent from the linker map; its VA 0x80278504
# was recovered by decoding the jal inside load_engine_code_segment from
# the retail ROM (offset 0x339DC), with the engine constants
# (srcStart 0xF5580, srcEnd 0x108A10 — matching the map's
# _engineSegmentRomStart/_engineSegmentRomEnd exactly, sign-extended
# addiu included) staged into $a1/$a2 at that call site. SM64 stores
# these segments uncompressed at their physical offsets, hence
# device_space Physical. Call sites with runtime arguments (the level
# script loader) are reported open, never guessed.

[[request_dma]]
name = "dma_read"
callee_va = 0x80278504
dram_arg_register = 4
device_arg_register = 5
size_arg_register = 6
size_is_end_address = true
device_space = "Physical"

[request_dma.bank_name]
prefix = "request_dma_"

# STATUS (2026-07-20): all six dma_read call sites currently report open
# operands. The engine site (0x802789DC) stages $a1/$a2 as constants in
# its own straight-line window, but $a0 (dest) is SPILLED to a
# caller-frame stack slot BEFORE an intervening bzero call and reloaded
# in the jal's delay slot — recovering it requires persisting
# caller-frame stack slots across direct calls. That is o32-ABI-sound
# (callees do not write the caller's frame) but deliberately outside the
# slicer's documented straight-line contract (see pi_dma's
# never_propagates_values_across_an_earlier_control_transfer test);
# extending that contract is an open design decision, recorded here
# rather than decided by a claims file.
