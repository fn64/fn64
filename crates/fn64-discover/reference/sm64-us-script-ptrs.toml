# Super Mario 64 (US) script-embedded pointer claims. All ranges and
# encodings cited from the n64decomp/sm64 decomp (build map symbols +
# data/behavior_data.c / include/geo_commands.h); every segment below is
# stored UNCOMPRESSED at its physical ROM range, and the embedded
# pointers are absolute VAs read from ROM bytes. Claims are graded
# adversarially by the wrong==0 posture: a bogus record that splits a
# real answer function fails the gate.
#
# behavior: CALL_NATIVE = [0x0C000000][ptr].
# geo layouts (actor groups + common): GEO_SWITCH_CASE [0x0E00cccc],
# GEO_ASM [0x1800pppp], GEO_BACKGROUND [0x1900bbbb], each followed by a
# raw GraphNodeFunc/callback pointer; mask 0xFFFF0000 pins cmd byte and
# the zero second byte.

[[script_ptr_tables]]
name = "behavior_call_native"
rom_start = 0x219e00
rom_end = 0x21f4c0
command_words = [0xc000000]
command_mask = 0xFFFF0000

