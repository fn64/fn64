# Kirby 64 (US) byte-adjudicated interior entries. The K64 answer key is
# WIP and gap-derives sizes, lumping unlabeled real functions into the
# preceding labeled symbol. Each entry below was adjudicated at byte
# level (2026-07-20): the word pair before it is a `jr $ra; nop`
# function terminator and the entry itself begins a fresh
# `addiu sp,sp,-N` prologue, so a discovery root there is correct
# finer-grained output, not a mis-split. Consumed as grading excuses
# only — never as discovery input.

