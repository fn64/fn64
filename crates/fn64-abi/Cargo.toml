[package]
name = "fn64-abi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The extern \"C\" surface recompiled N64Recomp game code links against. See docs/DESIGN.md section 1 and aki-recomp/runtime/ABI-SURFACE.md."

[lib]
# Recompiled RecompiledFuncs/*.c object files link against this as a
# staticlib; the C smoke test in tests/c_smoke exercises exactly that link
# shape at a small scale.
crate-type = ["lib", "staticlib"]

[features]
default = []
recomp-rs = ["dep:fn64-cpu-runtime"]
dynamic-mapped-runtime = ["recomp-rs", "fn64-cpu-runtime/dynamic-mapped-runtime"]

[dependencies]
fn64-runtime = { path = "../fn64-runtime" }
# The RenderBackend trait ONLY (docs/DECOUPLING.md) -- fn64-abi routes the
# gfx half of osSpTaskYielded_recomp through `dyn RenderBackend`, exactly
# like the audio half already routes through the registered
# `AudioUcodeFn`. This crate never has a production dependency on a concrete
# backend crate; the shell registers whichever `Box<dyn RenderBackend>` it
# constructed, keeping fn64-abi backend-agnostic.
fn64-render = { path = "../fn64-render" }
# The AudioBackend trait ONLY (docs/DECOUPLING.md's fn64-audio crate plan)
# -- fn64-abi routes M_AUDTASK's sample-delivery half through `dyn
# AudioBackend`, symmetric with the gfx routing above. Ucode EXECUTION
# stays on the pre-existing `AudioUcodeFn` seam (unchanged); this is the
# NEW seam for getting already-decoded samples to a host backend.
fn64-audio = { path = "../fn64-audio" }
# Needed to name `corosensei::Yielder<Resume, Yield>`'s type directly (the
# active-coroutine-suspend plumbing in src/lib.rs) -- same crate/version
# fn64-runtime uses, per docs/DESIGN.md section 2's single stackful-
# coroutine model; not a second, competing coroutine implementation.
corosensei = "0.3"
fn64-cpu-runtime = { path = "../fn64-cpu-runtime", optional = true, default-features = false, features = ["aot-runtime"] }
# `asm` selects sha2's aarch64/x86 hardware backend. The canonical mutation
# journal SHA-256s the whole watched region -- the 1 MiB boot bank on WM2000 --
# at every dispatch boundary, and profiling the shell found ~42% of samples in
# `sha2::sha256::soft::compress`, the pure-software fallback, against ONE
# sample in actual guest execution.
#
# This is a backend swap, not a semantic one: the backend runtime-detects the
# CPU feature and falls back to `soft` when absent, so digests are identical on
# every host and no receipt or journal root changes.
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
# Only for a test proving the gfx-task seam actually reaches a real backend
# end-to-end (not just the trait in isolation) -- never a non-test
# dependency, keeping fn64-abi's real dependency graph backend-agnostic per
# docs/DECOUPLING.md.
fn64-render-reference = { path = "../fn64-render-reference" }
fn64-cpu-runtime = { path = "../fn64-cpu-runtime", features = ["dev-interpreter"] }
# Only for tests proving the T4 raw-DPC session routing
# (`set_raw_dpc_session`/`try_dispatch_raw_dpc_via_session`) actually reaches
# a real plan/execute/publish backend end-to-end. Same rule as
# fn64-render-reference above: never a non-test dependency. `WgpuBackend`'s
# raw-DPC seam is pure Rust (`RawDpcCoordinator`/`PhysicalTmemState`, no GPU
# device), so no `host-gpu-tests` feature or real adapter is needed here.
fn64-render-wgpu = { path = "../fn64-render-wgpu" }
