# The rs-lane configuration of fn64-shell: the SAME src/main.rs and build.rs,
# but the game arrives as the emitted `game-recompiled` typed-Rust crate
# instead of compiled RecompiledFuncs C. A standalone workspace (like
# a title's own rs manifest) because `game-recompiled` is out-of-tree game-derived
# material that must never enter the main workspace graph.
#
# Build (the recompiled symlink is refreshed from RECOMP_RS_DIR first, same
# contract as examples/oot-boot's `oot` runner):
#   ln -sfn "$RECOMP_RS_DIR" crates/fn64-shell/rs/recompiled
#   FN64_RECOMP=rs ROM=... cargo build --manifest-path crates/fn64-shell/rs/Cargo.toml \
#     --release --features rt64
[package]
name = "fn64-shell-rs"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
build = "../build.rs"
description = "Rust-recompiled whole-ROM configuration of the fn64 windowed shell"

[workspace]

[features]
rt64 = ["fn64-render-rt64/rt64"]

[[bin]]
name = "fn64"
path = "../src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
libc = "0.2"
winit = { version = "0.30", features = ["serde"] }
pixels = "0.15"
gilrs = { version = "0.11", features = ["serde-serialize"] }
egui = "0.27"
egui-wgpu = "0.27"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
fn64-runtime = { path = "../../fn64-runtime" }
fn64-abi = { path = "../../fn64-abi", features = ["recomp-rs"] }
fn64-boot-harness = { path = "../../fn64-boot-harness", features = ["recomp-rs"] }
fn64-cpu-runtime = { path = "../../fn64-cpu-runtime" }
fn64-render = { path = "../../fn64-render" }
fn64-render-reference = { path = "../../fn64-render-reference" }
fn64-render-rt64 = { path = "../../fn64-render-rt64" }
# The all-Rust renderer half of the target stack (`fn64-cpu-runtime` +
# `fn64-render-wgpu`), and the ONLY renderer this manifest can reach without a
# native C++ adapter. It is not optional: `src/main.rs` names
# `fn64_render_wgpu::WgpuBackend::try_new()` UNCONDITIONALLY in its
# `FN64_RENDER` dispatch, so omitting it here is not "wgpu is unavailable on
# the rs lane" -- it is a hard `E0433: unresolved module` that made
# `FN64_RECOMP=rs` fail to compile at all, for every title and every renderer.
# The sibling harness manifest (recomps/wm2000/packages/wm2000-boot/rs) has
# carried this dependency all along, which is why the headless rs lane built
# while this one did not.
#
# Unlike `fn64-render-rt64` it needs no Cargo feature and no C++ toolchain:
# `WgpuBackend::try_new` is available unconditionally, so `FN64_RENDER=wgpu`
# works on a plain `cargo build` with no `--features`.
fn64-render-wgpu = { path = "../../fn64-render-wgpu" }
fn64-audio = { path = "../../fn64-audio" }
# Refreshed symlink to the env-selected out-of-tree emitted crate (Cargo
# `path` cannot interpolate env vars) -- same bridge as oot-boot/rs.
# `package = "oot-recompiled"` because recompile_rom hardcodes that crate name
# in every manifest it emits (crates/fn64-cpu-runtime-codegen/src/bin/
# recompile_rom.rs), regardless of which ROM it consumed -- the name is NOT
# evidence about which title is linked. Cargo's dependency rename gives the
# shell a title-neutral local name without editing the emitted manifest.
game-recompiled = { path = "recompiled", package = "oot-recompiled" }

[target.'cfg(target_os = "macos")'.dependencies]
# winit has no macOS window-icon operation; AppKit owns the process-wide Dock
# icon. These are the same objc2 versions/features winit 0.30 already builds.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
