[package]
name = "fn64-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fn64's executable: window, input, audio out, ROM/RecompiledFuncs intake. See docs/DESIGN.md section 1."

[[bin]]
name = "fn64"
path = "src/main.rs"

[features]
# RT64 static backend passthrough (FN64_RENDER=rt64 at runtime needs the
# backend compiled in). Same shape as oot-boot's feature.
rt64 = ["fn64-render-rt64/rt64"]

[build-dependencies]
# Compiles the out-of-tree RecompiledFuncs/*.c plus fn64-boot-harness's shared
# section bridge only when RECOMPILED_DIR is set (see build.rs). A no-op otherwise, so a
# content-free workspace build needs no C toolchain invocation.
cc = "1"

[dependencies]
fn64-runtime = { path = "../fn64-runtime" }
fn64-timing-trace = { path = "../fn64-timing-trace" }
fn64-abi = { path = "../fn64-abi" }
fn64-boot-harness = { path = "../fn64-boot-harness" }
fn64-render = { path = "../fn64-render" }
fn64-render-reference = { path = "../fn64-render-reference" }
fn64-render-rt64 = { path = "../fn64-render-rt64" }
# The pure-Rust wgpu backend (FN64_RENDER=wgpu). Selectable, not the
# default: its admitted set is the T3 raw-DPC seam (TMEM loads, admitted
# state/triangle commands, fill-cycle FillRectangle) plus VI scanout, and
# everything outside it is a named refusal, not a fallback.
fn64-render-wgpu = { path = "../fn64-render-wgpu" }
# cpal-backed AudioBackend lives here; we register it via
# fn64_abi::set_audio_backend to wire the audio OUTPUT path.
fn64-audio = { path = "../fn64-audio" }
sha2 = "0.10"

# Window + live framebuffer present. Both MIT/Apache-2.0 (permissive).
# winit drives the window + keyboard events. The `serde` feature is for
# persisting `KeyCode` bindings in the input config TOML.
winit = { version = "0.30", features = ["serde"] }
# The presentation surface (`src/present.rs`). Pinned to the SAME `=30.0.0`
# `fn64-render-wgpu` pins, so the workspace compiles ONE wgpu, naga, and
# objc2 tree: the shell previously reached the GPU through `pixels`, whose
# wgpu 0.19 was a second full tree that also dragged in the
# future-incompatible `block 0.1.6`. Same default-feature posture as
# `fn64-render-wgpu` so the two resolve to one feature-unified build.
wgpu = { version = "=30.0.0", default-features = false, features = ["dx12", "metal", "vulkan", "vulkan-portability", "wgsl"] }

# Gamepad input (issue #4). `serde-serialize` persists `gilrs::Button`
# bindings in the input config TOML.
gilrs = { version = "0.11", features = ["serde-serialize"] }

# The in-game settings overlay (issue #5). 0.36 is the egui line built
# against wgpu 30 and winit 0.30 -- the versions this shell already uses.
# egui-winit is deliberately absent; the shell hand-translates the few mouse
# events the overlay needs (see overlay.rs).
egui = "0.36"
egui-wgpu = "0.36"

# Input config persistence: ~/.config/fn64/input.toml.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# winit has no macOS window-icon operation; AppKit owns the process-wide Dock
# icon. These are the same objc2 versions/features winit 0.30 already builds.
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry"] }

[dev-dependencies]
tempfile = "3"
# Validate the frame-presentation WGSL against the same Naga line wgpu 30
# ships, before a Metal window reaches shader-module creation.
naga = { version = "30", features = ["wgsl-in"] }

# Audio tasks execute admitted live IMEM through the ABI's explicit LLE
# accuracy policy. Optional translated artifacts are not shell features or
# release authority.
