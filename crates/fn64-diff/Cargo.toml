[package]
name = "fn64-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The first-divergence comparator: diff fn64's claimed register state at a checkpoint PC against a reference runtime's ground truth and report the first field that disagrees. Pure -- no I/O. See docs/DESIGN.md §1.0 and §4."

