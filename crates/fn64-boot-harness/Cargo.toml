[package]
name = "fn64-boot-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared generated-C registration and RDRAM boot seam for fn64 harnesses."

[features]
default = ["c-bridge"]
c-bridge = []
recomp-rs = ["fn64-abi/recomp-rs", "dep:fn64-recomp-rs"]

[dependencies]
fn64-abi = { path = "../fn64-abi" }
fn64-runtime = { path = "../fn64-runtime" }
fn64-recomp-rs = { path = "../fn64-recomp-rs", optional = true }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
