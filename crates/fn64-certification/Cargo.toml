[package]
name = "fn64-certification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Executable behavioral certification gates for fn64 backends."

[features]
default = []
rt64 = ["fn64-render-rt64/rt64"]
hfr-evidence = ["rt64", "fn64-render-rt64/hfr-evidence"]
extended-gbi-evidence = ["rt64", "fn64-render-rt64/extended-gbi-evidence"]

[dependencies]
fn64-render = { path = "../fn64-render" }
fn64-render-rt64 = { path = "../fn64-render-rt64", default-features = false }
fn64-runtime = { path = "../fn64-runtime" }
sha2 = "0.10"

[dev-dependencies]
fn64-render-reference = { path = "../fn64-render-reference" }

[[example]]
name = "rt64_metal_backend_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_vi_filter_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_resolution_downsample_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_user_controls_rebuild_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_enhancement_emulator_controls_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_framebuffer_rdram_region_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_framebuffer_enhancement_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_texture_replacement_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_latency_skip_buffering_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_latency_present_early_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_deferred_debugger_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_ubershader_pipeline_behavior"
required-features = ["rt64"]

[[example]]
name = "rt64_hfr_interpolation_behavior"
required-features = ["rt64", "hfr-evidence"]

[[example]]
name = "rt64_extended_gbi_enhancement_behavior"
required-features = ["rt64", "extended-gbi-evidence"]
